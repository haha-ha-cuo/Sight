[project]
name = "sight-backend"
version = "0.1.0"
description = "Sight RSS prototype with Flask and AgentScope 2.x"
requires-python = ">=3.12"
dependencies = [
    "agentscope>=2,<3",
    "feedparser>=6.0,<7",
    "flask>=3.1.3",
    "httpx>=0.28,<1",
    "pymysql[rsa]>=1.2.4",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
